<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guru - LLM Tutor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Guru</h1>
      <form id="new-subject-form">
        <input id="new-subject-name" type="text" placeholder="New subject, e.g. Social" required />
        <button type="submit">+ Add subject</button>
      </form>
      <ul id="subject-list" class="subject-list"></ul>
    </aside>

    <main class="content">
      <div id="empty-state" class="empty-state">
        <p>Select a subject on the left, or create a new one to get started.</p>
      </div>

      <div id="subject-view" class="subject-view" hidden>
        <h2 id="subject-title"></h2>

        <form id="upload-form">
          <input id="upload-input" type="file" accept=".pdf,.docx,.txt,.md" multiple required />
          <button type="submit">Upload material</button>
        </form>
        <p class="hint">Supported: PDF, DOCX, TXT, MD &mdash; select multiple to upload them all at once</p>

        <div id="upload-progress-list" class="upload-progress-list"></div>

        <table class="materials-table">
          <thead>
            <tr>
              <th>File</th>
              <th>Status</th>
              <th>Chunks</th>
              <th>Uploaded</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="materials-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
