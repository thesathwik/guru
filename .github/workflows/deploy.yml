name: Build and Deploy

# Dormant while the GitHub account is billing-locked: jobs are refused
# before a runner is assigned, so nothing here runs. Cloud Build does the
# deploying in the meantime (see DEPLOY_GCP.md, "4b"), and this workflow
# hands off to the same cloudbuild.yaml, so whichever path runs, the
# deploy is defined in exactly one place.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PROJECT_ID: bicycle-503702
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for Workload Identity Federation: lets the job mint the
      # OIDC token that GCP exchanges for short-lived credentials. No
      # service account key is stored in this repo.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/981400413289/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: guru-deployer@bicycle-503702.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Everything about the deploy - the build arg, the memory, the
      # environment, updating the worker job - lives in cloudbuild.yaml.
      # Duplicating it here is how the two drift apart and one of them
      # quietly redeploys the wrong configuration.
      - name: Build and deploy via Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=_TAG=${{ github.sha }} \
            --region=global \
            .

      - name: Show service URL
        run: |
          gcloud run services describe guru \
            --region=${{ env.REGION }} --format='value(status.url)'
